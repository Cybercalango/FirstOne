name: Deploy Cloudflare (firstone)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.FISTONESECRET_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FISRTONESECRET_ANON }}
        run: npm run build
      - name: Deploy dist/ as Workers Assets do worker "firstone"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --name firstone --compatibility-date 2026-10-12 --assets ./dist
