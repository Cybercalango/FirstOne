name: CI Build

on:
  push:
    branches: [ "mobile/improvements", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.FISTONESECRET_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.FISRTONESECRET_ANON }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
